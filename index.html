<!DOCTYPE html>
<html lang="zh-CN" data-theme="ivory">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236ea8fe'/%3E%3Cstop offset='1' stop-color='%23b48cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M23 8c-6 0-11 3-12 9-.4 2.4-1.2 4.2-2 5 1 .3 2.2 0 3.6-1 1.7-1.2 2.9-3 3.6-5.6.6 1.9.2 3.6-1.2 5' fill='none' stroke='white' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <!-- 下面这些中文是「默认语言（简体中文）」的兜底值：静态 HTML 用不了 t()，
         启动时由 app.js 的 applyStaticLabels() / updateTitle() 按当前语言覆写。
         <html lang> 由 i18n.js 的 setLocale() 负责。 -->
    <title>QuillPad · 现代文本与代码编辑器</title>
  </head>
  <body>
    <div class="app" id="app">
      <!-- 1. 标题栏 -->
      <header class="titlebar" id="titlebar">
        <div class="titlebar__brand" id="brand">
          <span class="brand-logo" id="brand-logo" aria-hidden="true"></span>
          <span class="brand-name">QuillPad</span>
        </div>
        <div class="titlebar__title" id="titlebar-title">
          <span class="doc-name">未打开文件</span>
        </div>
        <div class="titlebar__actions" id="titlebar-actions"></div>
      </header>

      <!-- 2. 菜单栏 -->
      <nav class="menubar" id="menubar" role="menubar" aria-label="主菜单"></nav>

      <!-- 3. 工具栏 -->
      <div class="toolbar" id="toolbar" role="toolbar" aria-label="工具栏"></div>

      <!-- 4. 主体 -->
      <div class="workspace" id="workspace">
        <aside class="sidebar" id="sidebar" aria-label="侧边栏"></aside>
        <div class="sidebar-resizer" id="sidebar-resizer" role="separator" aria-orientation="vertical"></div>
        <div class="editor-pane" id="editor-pane">
          <div class="tabbar" id="tabbar" role="tablist" aria-label="已打开文件"></div>
          <div class="editor-split" id="editor-split">
            <div class="editor-host" id="editor-host"></div>
            <div class="preview-pane" id="preview-pane" hidden></div>
          </div>
          <div class="find-files" id="find-files" hidden></div>
        </div>
      </div>

      <!-- 5. 状态栏 -->
      <footer class="statusbar" id="statusbar"></footer>

      <!-- 6. 欢迎页（无标签时显示） -->
      <div class="welcome" id="welcome" hidden></div>
    </div>

    <div class="toast-root" id="toast-root" aria-live="polite"></div>
    <div class="overlay-root" id="overlay-root"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
