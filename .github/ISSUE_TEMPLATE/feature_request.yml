name: 💡 功能建议
description: 提出新功能或改进想法
title: '[Feature] '
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请先说明你遇到的**问题**，再说你希望的**方案** —— 这样我们才能判断是否该用别的方式解决。

  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue 与 Discussions，确认这不是重复建议
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述当前的不便之处，而不是直接说「请加个 xxx 按钮」
      placeholder: '例如：我在写长文时经常需要调整字号，每次都要点工具栏两次，很打断节奏。'
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      placeholder: '例如：希望支持 Ctrl+滚轮直接缩放字号。'
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 编辑器内核
        - Markdown / WYSIWYG
        - PDF 导出
        - 插件系统
        - 界面 / 主题
        - 文件管理 / 标签栏
        - 其他
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考截图、其他编辑器的类似实现等
    validations:
      required: false
