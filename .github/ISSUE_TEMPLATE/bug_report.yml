name: 🐛 Bug 报告
description: 报告一个可复现的问题，帮助我们改进
title: '[Bug] '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整，信息不足的问题很难定位。

        **安全漏洞请勿在此提交**，见 [SECURITY.md](https://github.com/Frank-TCA/quillpad-desktop/blob/main/SECURITY.md)。

  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，确认这不是重复问题
          required: true
        - label: 我使用的是最新版本
          required: true

  - type: input
    id: version
    attributes:
      label: QuillPad 版本
      description: 见「帮助 → 关于」
      placeholder: '例如：1.0.0'
    validations:
      required: true

  - type: dropdown
    id: edition
    attributes:
      label: 安装方式
      options:
        - 安装版（Setup.exe）
        - 便携版（portable.exe）
        - 从源码运行
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: '例如：Windows 11 23H2 x64'
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写出能稳定复现的最少步骤
      placeholder: |
        1. 打开 xxx.md
        2. 选中第 2 行
        3. 右键 → 标记颜色 → 红色
        4. 切换到另一个标签再切回
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 如有报错信息或控制台输出，请一并粘贴（开发者工具 `Ctrl+Shift+I`）
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 截图 / 录屏 / 其他信息
      description: 界面问题强烈建议附图。可直接拖拽图片到此区域。
    validations:
      required: false
